<!DOCTYPE html>
<html><body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
// Seeded RNG so renders are reproducible.
function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function base(ctx, W, H, glowX, glowY, glowR) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#03050c");
  g.addColorStop(0.55, "#060a1c");
  g.addColorStop(1, "#0a1236");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, glowR);
  r.addColorStop(0, "rgba(40,80,255,0.55)");
  r.addColorStop(0.45, "rgba(24,48,200,0.18)");
  r.addColorStop(1, "rgba(10,20,80,0)");
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
}

function grain(ctx, W, H, amt, R) {
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}

function glowDot(ctx, x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace("A", a)); g.addColorStop(1, color.replace("A", 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

// 1. A dotted globe of assets rising like a planet horizon, with arcs between connected points.
function globe(W, H) {
  const c = document.getElementById("c"); c.width = W; c.height = H; const ctx = c.getContext("2d"); const R = rng(7);
  const cx = W * 0.72, R0 = H * 0.62, cy = H * 1.0;
  base(ctx, W, H, cx, cy - R0 * 0.2, H * 1.1);
  // faint stars, kept sparse and dim so the headline area stays calm
  for (let i = 0; i < 260; i++) { const x = R() * W, y = R() * H * 0.55; ctx.fillStyle = `rgba(190,205,255,${0.05 + R() * 0.18})`; ctx.fillRect(x, y, 1.6, 1.6); }
  // atmosphere
  ctx.save(); ctx.filter = "blur(60px)"; ctx.strokeStyle = "rgba(50,100,255,0.9)"; ctx.lineWidth = 70; ctx.beginPath(); ctx.arc(cx, cy, R0 + 10, 0, 7); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.filter = "blur(14px)"; ctx.strokeStyle = "rgba(120,170,255,0.8)"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, R0, 0, 7); ctx.stroke(); ctx.restore();
  // body
  const body = ctx.createRadialGradient(cx, cy - R0 * 0.6, R0 * 0.1, cx, cy, R0);
  body.addColorStop(0, "rgba(14,26,90,1)"); body.addColorStop(0.85, "rgba(6,10,36,1)"); body.addColorStop(1, "rgba(30,60,200,1)");
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(cx, cy, R0, 0, 7); ctx.fill();
  // points on a fibonacci sphere, tilted toward the viewer
  const N = 30000, tilt = 0.42, rot = 0.9, pts = [];
  // 3D value noise (fbm) so "continents" of assets spread naturally over the sphere.
  const hash = (i, j, k) => { let h = (i * 374761393 + j * 668265263 + k * 1274126177) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const sm = (t) => t * t * (3 - 2 * t);
  const vnoise = (x, y, z) => {
    const i = Math.floor(x), j = Math.floor(y), k = Math.floor(z), fx = sm(x - i), fy = sm(y - j), fz = sm(z - k);
    let v = 0;
    for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let c = 0; c < 2; c++)
      v += hash(i + a, j + b, k + c) * (a ? fx : 1 - fx) * (b ? fy : 1 - fy) * (c ? fz : 1 - fz);
    return v;
  };
  const land = (x, y, z) => { let v = 0, amp = 0.5, f = 2.2; for (let o = 0; o < 4; o++) { v += amp * vnoise(x * f + 10, y * f + 20, z * f + 30); amp *= 0.5; f *= 2; } return v; };
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < N; i++) {
    const y0 = 1 - (i / (N - 1)) * 2, rr = Math.sqrt(1 - y0 * y0), th = Math.PI * (3 - Math.sqrt(5)) * i;
    let x = Math.cos(th) * rr, y = y0, z = Math.sin(th) * rr;
    const isLand = land(x, y, z) > 0.46;
    let x1 = x * Math.cos(rot) + z * Math.sin(rot), z1 = -x * Math.sin(rot) + z * Math.cos(rot);
    let y2 = y * Math.cos(tilt) - z1 * Math.sin(tilt), z2 = y * Math.sin(tilt) + z1 * Math.cos(tilt);
    if (z2 < 0) continue;
    const px = cx + x1 * R0, py = cy - y2 * R0;
    if (py > H + 4 || px < -4 || px > W + 4) continue;
    pts.push({ px, py, z2, isLand });
    const b = (isLand ? 0.95 : 0.22) * (0.3 + 0.7 * z2) + (1 - z2) * 0.06;
    const s = isLand ? 3 : 2;
    ctx.fillStyle = isLand ? `rgba(150,185,255,${b})` : `rgba(90,120,255,${b})`;
    ctx.fillRect(px - s / 2, py - s / 2, s, s);
  }
  // connections: arcs lifted off the surface between land points
  const land2 = pts.filter((p) => p.isLand && p.py < H * 0.97 && p.z2 > 0.45);
  for (let k = 0; k < 44; k++) {
    const a = land2[Math.floor(R() * land2.length)], b = land2[Math.floor(R() * land2.length)];
    const d = Math.hypot(a.px - b.px, a.py - b.py); if (d < 140 || d > R0 * 1.1) continue;
    const mx = (a.px + b.px) / 2, my = (a.py + b.py) / 2;
    const nx = mx - cx, ny = my - cy, nl = Math.hypot(nx, ny), lift = d * 0.32;
    const qx = mx + (nx / nl) * lift, qy = my + (ny / nl) * lift;
    const g = ctx.createLinearGradient(a.px, a.py, b.px, b.py);
    g.addColorStop(0, "rgba(120,200,255,0.05)"); g.addColorStop(0.5, "rgba(170,215,255,0.75)"); g.addColorStop(1, "rgba(120,200,255,0.05)");
    for (const [w, al] of [[7, 0.12], [2, 1]]) {
      ctx.save(); ctx.globalAlpha = al; if (w > 2) ctx.filter = "blur(6px)";
      ctx.strokeStyle = g; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.quadraticCurveTo(qx, qy, b.px, b.py); ctx.stroke(); ctx.restore();
    }
    for (const p of [a, b]) { glowDot(ctx, p.px, p.py, 16, "rgba(140,200,255,A)", 0.7); ctx.fillStyle = "rgba(235,245,255,1)"; ctx.beginPath(); ctx.arc(p.px, p.py, 2.6, 0, 7); ctx.fill(); }
  }
  ctx.globalCompositeOperation = "source-over";
  grain(ctx, W, H, 7, R);
}

// 2. Silk-like streams of light: one ribbon of many fine lines, twisting across the lower half.
function streams(W, H) {
  const c = document.getElementById("c"); c.width = W; c.height = H; const ctx = c.getContext("2d"); const R = rng(21);
  base(ctx, W, H, W * 0.55, H * 0.8, H * 0.95);
  ctx.globalCompositeOperation = "lighter";
  const ribbon = (lines, y0, amp, twist, hueA, hueB, alpha, lw) => {
    for (let i = 0; i < lines; i++) {
      const t = i / (lines - 1);
      const g = ctx.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0, `hsla(${hueA},100%,60%,0)`);
      g.addColorStop(0.25, `hsla(${hueA},100%,62%,${alpha})`);
      g.addColorStop(0.6, `hsla(${(hueA + hueB) / 2},100%,66%,${alpha * 1.2})`);
      g.addColorStop(1, `hsla(${hueB},100%,70%,${alpha * 0.8})`);
      ctx.strokeStyle = g; ctx.lineWidth = lw; ctx.beginPath();
      for (let x = -20; x <= W + 20; x += 6) {
        const u = x / W;
        const width = amp * (0.35 + 0.65 * Math.sin(u * Math.PI * 1.1 + 0.3));
        const y = y0 + Math.sin(u * 5.2 + 0.8) * H * 0.07 + Math.sin(u * 2.1 - 0.5) * H * 0.09
          + (t - 0.5) * width * Math.cos(u * twist + t * 0.9);
        x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  };
  ctx.save(); ctx.filter = "blur(30px)"; ribbon(40, H * 0.72, H * 0.5, 6.3, 228, 200, 0.14, 8); ctx.restore();
  ribbon(200, H * 0.72, H * 0.5, 6.3, 228, 200, 0.1, 1.6);
  ribbon(90, H * 0.8, H * 0.22, 8.5, 250, 215, 0.06, 1.1);
  // a few sparks travelling the ribbon
  for (let k = 0; k < 28; k++) { const x = R() * W, y = H * (0.62 + R() * 0.26); glowDot(ctx, x, y, 5 + R() * 8, "rgba(170,220,255,A)", 0.3 + R() * 0.4); }
  ctx.globalCompositeOperation = "source-over";
  grain(ctx, W, H, 7, R);
}

// 3. A perspective grid of nodes (the estate), a few raised as assets, one attack path lit across it.
function mesh(W, H) {
  const c = document.getElementById("c"); c.width = W; c.height = H; const ctx = c.getContext("2d"); const R = rng(3);
  const hz = H * 0.34, cx = W * 0.5, f = H * 0.42, camY = 4.2;
  base(ctx, W, H, cx, hz, W * 0.55);
  const proj = (x, z, y = 0) => ({ x: cx + (x / z) * f, y: hz + ((camY - y) / z) * f, s: 1 / z });
  ctx.globalCompositeOperation = "lighter";
  // grid lines, fading into the horizon haze
  for (let gx = -40; gx <= 40; gx += 1) {
    const a = proj(gx, 1.2), b = proj(gx, 60);
    const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    g.addColorStop(0, "rgba(70,110,255,0.28)"); g.addColorStop(1, "rgba(70,110,255,0)");
    ctx.strokeStyle = g; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (let z = 1.2; z < 60; z *= 1.1) {
    const a = proj(-60, z), b = proj(60, z);
    ctx.strokeStyle = `rgba(70,110,255,${0.26 * Math.min(1, 3 / z)})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // nodes at intersections
  const nodes = [];
  for (let gx = -30; gx <= 30; gx++) for (let z = 2; z < 40; z += 1) {
    if (R() > 0.2) continue;
    const p = proj(gx, z); if (p.x < -20 || p.x > W + 20 || p.y > H + 20) continue;
    nodes.push({ gx, z, p });
    const r = Math.max(1.6, 14 * p.s);
    glowDot(ctx, p.x, p.y, r * 5, "rgba(80,140,255,A)", 0.5 * Math.min(1, 6 / z));
    ctx.fillStyle = `rgba(200,222,255,${Math.min(1, 8 / z)})`; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
  }
  // raised assets: light columns
  for (let k = 0; k < 22; k++) {
    const n = nodes[Math.floor(R() * nodes.length)]; if (!n || n.z > 26) continue;
    const h = 1 + R() * 3.5, top = proj(n.gx, n.z, h);
    const g = ctx.createLinearGradient(n.p.x, n.p.y, top.x, top.y);
    g.addColorStop(0, "rgba(110,170,255,0.65)"); g.addColorStop(1, "rgba(110,170,255,0)");
    ctx.strokeStyle = g; ctx.lineWidth = Math.max(2, 14 * n.p.s); ctx.beginPath(); ctx.moveTo(n.p.x, n.p.y); ctx.lineTo(top.x, top.y); ctx.stroke();
  }
  // the attack path: a lit route along grid edges
  // The lit route stays in the right half, clear of where the headline sits.
  const path = [[14, 3.4], [14, 5], [10, 5], [10, 8], [14, 8], [14, 11], [9, 11], [9, 15], [13, 15], [13, 21]];
  const pp = path.map(([x, z]) => proj(x, z));
  for (const [w, al, blur] of [[22, 0.35, 16], [5, 0.9, 0], [2, 1, 0]]) {
    ctx.save(); ctx.globalAlpha = al; if (blur) ctx.filter = `blur(${blur}px)`;
    ctx.strokeStyle = w === 2 ? "rgba(235,245,255,1)" : "rgba(90,170,255,1)"; ctx.lineWidth = w; ctx.lineJoin = "round";
    ctx.beginPath(); pp.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.stroke(); ctx.restore();
  }
  pp.forEach((p, i) => { if (i % 2) return; glowDot(ctx, p.x, p.y, 60 * p.s * 3, "rgba(120,190,255,A)", 0.8); ctx.strokeStyle = "rgba(220,235,255,0.9)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(5, 26 * p.s * 1.5), 0, 7); ctx.stroke(); });
  // horizon haze
  ctx.globalCompositeOperation = "source-over";
  const hzG = ctx.createLinearGradient(0, hz - H * 0.12, 0, hz + H * 0.06);
  hzG.addColorStop(0, "rgba(6,10,28,0)"); hzG.addColorStop(0.6, "rgba(30,60,190,0.35)"); hzG.addColorStop(1, "rgba(6,10,28,0)");
  ctx.fillStyle = hzG; ctx.fillRect(0, hz - H * 0.12, W, H * 0.18);
  grain(ctx, W, H, 7, R);
}
window.render = (name, W, H) => { ({ globe, streams, mesh })[name](W, H); return document.getElementById("c").toDataURL("image/png"); };
</script>
</body></html>
